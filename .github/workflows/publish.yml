# Publishes this package to npm through npm Trusted Publishing (OIDC): no npm token is stored anywhere, and npm
# attaches provenance because this repository is public.
# One-time setup on npmjs.com, package settings -> Trusted Publisher -> GitHub Actions:
#   organization/user sidorenkav-collab, repository paperclip-plugin-botarmor, workflow publish.yml
# Release: bump "version" in package.json and src/manifest.js, commit, then push a tag v<version> (e.g. v0.1.1).
name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which supports Trusted Publishing
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package and manifest versions
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
          test "v$(node --input-type=module -e "import m from './src/manifest.js'; console.log(m.version)")" = "${GITHUB_REF_NAME}"
      - run: npm publish --access public
